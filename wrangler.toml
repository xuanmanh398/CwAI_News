name = "tin-cong-nghe-ai"
compatibility_date = "2024-04-03"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./public"

[[d1_databases]]
binding = "DB"
database_name = "tin-cong-nghe-db"
database_id = "tin-cong-nghe-db-local"

[ai]
binding = "AI"

[vars]
SITE_NAME = "Tin Công Nghệ"
SITE_DESCRIPTION = "Chuyên trang cập nhật tin tức công nghệ, Trí tuệ nhân tạo (AI), phần mềm, an ninh mạng và thiết bị số nhanh và chính xác."
CANONICAL_ORIGIN = "http://localhost:8788"
FALLBACK_TO_METADATA = "true"
ADMIN_SESSION_SECRET = "change-this-in-production-to-a-secure-random-token-min-32-chars"
CRON_SECRET = "cron-secret-key-change-in-production"
ADSENSE_ENABLED = "false"
ADSENSE_CLIENT = ""
